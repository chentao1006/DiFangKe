org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dkotlin.daemon.jvm.options=-Xmx2g
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36
# AGP 9's built-in Kotlin support and new DSL conflict with the
# org.jetbrains.kotlin.android plugin as currently applied; opt out until we
# migrate to the new DSL.
android.builtInKotlin=false
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Fix TLS handshake issue
systemProp.https.protocols=TLSv1.2,TLSv1.3
